[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swim-platform-cloud"
version = "0.1.0"
description = "智泳云枢新版云端账号、机构与场馆基础"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.115.6", "pydantic==2.10.4", "sqlalchemy==2.0.36",
  "uvicorn==0.32.1", "alembic==1.14.0", "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["services/cloud/src"]

[tool.pytest.ini_options]
testpaths = ["services/cloud/tests"]
pythonpath = ["services/cloud/src"]
addopts = "-q"
